<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 440px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; font-size: 13px; color: #202124; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .modes { display: flex; gap: 6px; margin-bottom: 12px; }
  .modes label { flex: 1; text-align: center; padding: 8px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
  .modes input { display: none; }
  .modes label:has(input:checked) { background: #e8f0fe; border-color: #1a73e8; font-weight: 600; }
  .hidden { display: none !important; }
  .field { margin-bottom: 10px; }
  .field > label { display: block; margin-bottom: 4px; color: #555; }
  input[type=text], input[type=number] { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
  .row .field { flex: 1; margin-bottom: 0; }
  button { padding: 8px 12px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font-size: 13px; cursor: pointer; }
  button.secondary { background: #eef1f5; color: #202124; }
  button.full { width: 100%; }
  button:disabled { opacity: .5; cursor: default; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 270px; overflow-y: auto; padding: 6px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; margin-bottom: 8px; }
  .item { position: relative; border: 2px solid transparent; border-radius: 6px; background: #fff; overflow: hidden; cursor: pointer; }
  .item.selected { border-color: #1a73e8; }
  .item .thumb { height: 76px; display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50% / 12px 12px; }
  .item img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .item .dim { font-size: 10px; text-align: center; padding: 2px 0; color: #555; }
  .item input { position: absolute; top: 3px; left: 3px; margin: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .bar .links button { background: none; color: #1a73e8; padding: 2px 4px; }
  #status { margin-top: 10px; color: #555; min-height: 18px; word-break: break-word; }
  .hint { font-size: 11px; color: #777; margin-top: 3px; }
</style>
</head>
<body>
  <h1>Webpage Fetcher Tool</h1>
  <div class="modes">
    <label><input type="radio" name="mode" value="text" checked><span>Text content</span></label>
    <label><input type="radio" name="mode" value="images"><span>Images</span></label>
  </div>

  <div class="field">
    <label>Save to</label>
    <div class="row" style="margin:0">
      <div class="field"><input type="text" id="destName" readonly placeholder="Chrome default (Downloads)"></div>
      <button id="pickDir" class="secondary">Choose…</button>
      <button id="clearDir" class="secondary">Reset</button>
    </div>
  </div>

  <!-- TEXT MODE -->
  <div id="textPanel">
    <div class="field">
      <label for="filename">File name (optional)</label>
      <input type="text" id="filename" placeholder="Auto: from page URL">
      <div class="hint">Leave empty to use the page URL as the file name. The original URL is also saved inside the file.</div>
    </div>
    <button id="goText" class="full">Save text as .txt</button>
  </div>

  <!-- IMAGES MODE -->
  <div id="imagesPanel" class="hidden">
    <div class="row">
      <div class="field"><label for="minSize">Min size (px)</label><input type="number" id="minSize" min="0" placeholder="e.g. 100"></div>
      <div class="field"><label for="maxSize">Max size (px)</label><input type="number" id="maxSize" min="0" placeholder="no limit"></div>
      <button id="preload">Preload</button>
    </div>
    <div class="hint" style="margin:-4px 0 8px">Min applies to the shorter side, max to the longer side of each image.</div>
    <div id="previewWrap" class="hidden">
      <div class="bar">
        <span id="count"></span>
        <span class="links"><button id="selAll">Select all</button><button id="selNone">None</button></span>
      </div>
      <div id="grid"></div>
    </div>
    <button id="goImages" class="full" disabled>Download ZIP</button>
  </div>

  <div id="status"></div>
  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
